<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Learning Games</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Main page specific styles */
        body {
            font-family: 'Arial Rounded MT Bold', 'Helvetica', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        .container {
            text-align: center;
            max-width: 1200px;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        h1 {
            font-size: 60px;
            color: white;
            margin-bottom: 10px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
            animation: bounce-title 1s ease;
            margin-top: 20px;
        }

        .subtitle {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 50px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
            padding: 20px;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }

        .footer {
            color: white;
            font-size: 14px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            margin-top: 30px;
            padding: 0 20px;
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            h1 {
                font-size: 40px;
                margin-top: 10px;
                margin-bottom: 5px;
            }

            .subtitle {
                font-size: 18px;
                margin-bottom: 30px;
            }

            .games-grid {
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 15px;
                padding: 15px;
            }

            .footer {
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 32px;
                margin-top: 10px;
                margin-bottom: 5px;
            }

            .subtitle {
                font-size: 16px;
                margin-bottom: 25px;
            }

            .games-grid {
                grid-template-columns: 1fr;
                gap: 15px;
                padding: 10px;
            }

            .container {
                padding: 15px;
            }

            .decorative-emoji {
                font-size: 30px !important;
            }
        }
    </style>
</head>
<body>

    <div class="decorative-emoji emoji-1">🎉</div>
    <div class="decorative-emoji emoji-2">⭐</div>
    <div class="decorative-emoji emoji-3">✨</div>
    <div class="decorative-emoji emoji-4">🌟</div>

    <div class="container">
        <h1>🎮 Kids Learning Games</h1>
        <p class="subtitle">Choose a game and start learning today!</p>

        <div class="games-grid">
            <!-- Alphabet Game -->
            <div class="game-card" onclick="navigateTo('alphabet.html')">
                <div class="game-icon">🔤</div>
                <h2 class="game-title">Alphabet</h2>
            </div>

            <!-- Numbers Game -->
            <div class="game-card" onclick="navigateTo('numbers.html')">
                <div class="game-icon">🔢</div>
                <h2 class="game-title">Numbers</h2>
            </div>

            <!-- Color Quest Game -->
            <div class="game-card" onclick="navigateTo('colors.html')">
                <div class="game-icon">🎨</div>
                <h2 class="game-title">Colors</h2>
            </div>

            <!-- Shapes Game -->
            <div class="game-card" onclick="navigateTo('shapes.html')">
                <div class="game-icon">🔷</div>
                <h2 class="game-title">Shapes</h2>
            </div>

            <!-- Objects Game -->
            <div class="game-card" onclick="navigateTo('objects.html')">
                <div class="game-icon">📚</div>
                <h2 class="game-title">Objects</h2>
            </div>

            <!-- Transportation Game -->
            <div class="game-card" onclick="navigateTo('transportation.html')">
                <div class="game-icon">🚗</div>
                <h2 class="game-title">Vehicles</h2>
            </div>

            <!-- Careers Game -->
            <div class="game-card" onclick="navigateTo('careers.html')">
                <div class="game-icon">👨‍⚕️</div>
                <h2 class="game-title">Careers</h2>
            </div>

            <!-- Animals Game -->
            <div class="game-card" onclick="navigateTo('animals.html')">
                <div class="game-icon">🦁</div>
                <h2 class="game-title">Animals</h2>
            </div>

            <!-- Super Quiz Game -->
            <div class="game-card" onclick="navigateTo('question.html')">
                <div class="game-icon">🏆</div>
                <h2 class="game-title">Super Quiz</h2>
            </div>
        </div>

        <div class="footer">
            <p>✨ Made for Kids with ❤️ | Educational Games for Fun Learning ✨</p>
        </div>
    </div>

    <script>
        function navigateTo(page) {
            window.location.href = page;
        }
    </script>

</body>
</html>
